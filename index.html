<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CGPA Calculator</title>
<style>
:root{
--primary:#8b5cf6;--primary-dark:#7c3aed;--bg:#0b0718;
--card:#16112b;--text:#f8fafc;--muted:#cbd5e1;
}
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;padding:20px;color:var(--text);
background:linear-gradient(135deg,#0b0718,#1a1333)}
.container{max-width:1100px;margin:auto}
h1{text-align:center}
.card{background:rgba(22,17,43,.9);padding:20px;border-radius:16px;margin:10px 0}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}
button{padding:10px 14px;border:none;border-radius:10px;cursor:pointer;background:var(--primary);color:#fff}
input,select{width:100%;padding:10px;border-radius:10px;border:1px solid #333;background:#221a40;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:15px}
.results{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.result{text-align:center}
.small{color:var(--muted)}
</style>
</head>
<body>
<div class="container">
<h1>CGPA Calculator</h1>

<div class="card">
<label>Branch</label>
<select id="branch">
<option value="cse">CSE</option><option value="ece">ECE</option>
<option value="it">IT</option><option value="eee">EEE</option>
<option value="mech">MECH</option><option value="civ">CIVIL</option>
<option value="csm">CSM</option><option value="aim">AIM</option>
<option value="aid">AID</option><option value="cic">CIC</option>
</select>
<p class="small">Edit credits in branchCredits object inside JS.</p>
</div>

<div class="controls">
<button onclick="addSemester()">Add Semester</button>
<button onclick="calculateCGPA()">Calculate</button>
<button onclick="resetAll()">Reset</button>
</div>

<div id="counter"></div>
<div id="semesters" class="grid"></div>

<div class="results">
<div class="card result"><h3>Total Credits</h3><div id="totalCredits">0</div></div>
<div class="card result"><h3>Weighted Points</h3><div id="weightedPoints">0</div></div>
<div class="card result"><h3>CGPA</h3><div id="cgpa">0.00</div></div>
</div>
</div>

<script>
const branchCredits={
cse:[19.5,20.5,19,22,23,23,21,12],
ece:[22,22,21,22,23,22,18,15],
it:[22,22,21,22,23,22,18,15],
eee:[22,22,21,22,23,22,18,15],
mech:[22,22,21,22,23,22,18,15],
civ:[22,22,21,22,23,22,18,15],
csm:[22,22,21,22,23,22,18,15],
aim:[22,22,21,22,23,22,18,15],
aid:[22,22,21,22,23,22,18,15],
cic:[22,22,21,22,23,22,18,15]
};

let semCount=0,maxSem=8;

function credits(i){
 return branchCredits[document.getElementById('branch').value][i]||0;
}

function updateCounter(){
 document.getElementById('counter').innerText=`${semCount} of 8 semesters added`;
}

function addSemester(){
 if(semCount>=maxSem)return;
 semCount++;
 const div=document.createElement('div');
 div.className='card semester';
 div.innerHTML=`
 <h3>Semester ${semCount}</h3>
 <label>Credits</label>
 <input class="credit" readonly value="${credits(semCount-1)}">
 <label>SGPA</label>
 <input class="sgpa" type="number" min="0" max="10" step="0.01">
 ${semCount>1?'<button onclick="removeSemester(this)">Remove</button>':''}`;
 document.getElementById('semesters').appendChild(div);
 div.querySelector('.sgpa').addEventListener('input',calculateCGPA);
 updateCounter();
}

function removeSemester(btn){
 btn.parentElement.remove();
 semCount--;
 [...document.querySelectorAll('.semester h3')].forEach((e,i)=>e.textContent=`Semester ${i+1}`);
 updateCredits();
 updateCounter();
 calculateCGPA();
}

function updateCredits(){
 document.querySelectorAll('.semester').forEach((card,i)=>{
   card.querySelector('.credit').value=credits(i);
 });
}

function calculateCGPA(){
 let tc=0, wp=0;
 document.querySelectorAll('.semester').forEach((card,i)=>{
   const c=credits(i);
   const s=parseFloat(card.querySelector('.sgpa').value)||0;
   tc+=c; wp+=c*s;
 });
 document.getElementById('totalCredits').innerText=tc;
 document.getElementById('weightedPoints').innerText=wp.toFixed(2);
 document.getElementById('cgpa').innerText=(tc?wp/tc:0).toFixed(2);
}

function resetAll(){
 document.getElementById('semesters').innerHTML='';
 semCount=0;
 addSemester();
 calculateCGPA();
}

document.getElementById('branch').addEventListener('change',()=>{
 updateCredits(); calculateCGPA();
});

addSemester();
</script>
</body>
</html>
